interface:
  display_name: "GameDev Specification"
  short_description: "Converge an approved PRD into a buildable spec"
  default_prompt: "Use $gamedev-specification to converge only the exact approved PRD scope. Apply one scope+sufficiency invariant to Director, bounded Generator, persistent Architect, and Proofreader. The Generator MUST invoke the actual external $skill-specification-pipeline and MUST NOT bypass or locally replace it. Before generation run prepare-helper --operation generation; pass immutable GAMEDEV_HELPER_REQUEST_PATH and its exact request-bound resolved GAMEDEV_SPECIFICATION_CONTROLLER_PATH/SHA with exact TARGET_OPERATION, SPECIFICATION_PATH, approved PRD path/revision/SHA, and a PRD-language USER_REQUEST. The external helper alone owns its mode stages, passes, detailed coverage, and global not-applicable policy. After generic PASS and specification/report/coverage writes, its emitter first matches --controller path/SHA to the request, then runs the exact read-only controller preflight-helper-output command; the controller requires canonical PRD trace, positive integer revision, draft|approved status, and the request-bound approved language. The emitter validates the schema-1 controller/request/output SHA envelope and only then emits the request-named helper result; run record-helper-result, which reuses that preflight. The Director validates only request/result/output SHAs, authority/language, operation/route, exact write set, bound controller identity, external entrypoint/emitter fingerprints, artifact SHAs, and one-use consumption. It MUST NOT author the helper result or reconstruct/parse stage/pass topology. Use reject-helper-result only for a proven unchanged pre-preflight immutable invalid initial-generation PASS: only that recovery accepts a legacy HREQ1 without controller binding or current helper-fingerprint equality; preserve all bytes, record no helper credit, preserve its output SHA for the next bound HREQ continue route, and fail closed on valid output, drift, wrong replay inputs, or later progress; correction remains forbidden until replacement generation is consumed. The persistent Architect performs pre-accept semantic assessment and returns an exact-SHA non-empty section-applicability/minimality inventory covering every top-level section plus standalone diagram, table, hierarchy description, and footer block. Reject and enumerate correction for unsupported scaffolding or complexity; retain substantively PRD-backed content. Before any correction write run prepare-helper --operation correction with every correction ID, invoke the same external skill through spec-assistant -> fragment-capture against the exact current/prewrite SHA, then record-helper-result. Any drift, replay, local draft/result, active unconsumed request, foreign identity, write-boundary violation, or missing artifact fails closed. accept-spec takes only --preaccept-receipt and requires the consumed helper chain to end at the current SHA. No Proofreader credit exists before acceptance. After record-proofread, a byte-changing correction uses the same prepare/invoke/record flow; complete-cycle validates old acceptance at the wave input and the consumed correction chain, closes to awaiting_accept, and requires fresh preaccept plus accept-spec before a fresh Proofreader. No-edit complete-cycle preserves acceptance and reviewing. Apply KISS/YAGNI, ignore theoretical or optional improvements without concrete evidence on a current supported PRD path, stop when mandatory coverage and minimal sufficient design are proven, return SPEC_READY plus NEXT_ACTION, and do not start planning."

policy:
  allow_implicit_invocation: false
