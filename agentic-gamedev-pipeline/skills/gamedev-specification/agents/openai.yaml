interface:
  display_name: "GameDev Specification"
  short_description: "Converge an approved PRD into a buildable spec"
  default_prompt: "Use $gamedev-specification to converge only the exact approved PRD scope. Apply one scope+sufficiency invariant to Director, bounded Generator, persistent Architect, and Proofreader. The Generator MUST invoke the actual external $skill-specification-pipeline and MUST NOT bypass or locally replace it. Before generation run prepare-helper --operation generation; pass its immutable GAMEDEV_HELPER_REQUEST_PATH with exact TARGET_OPERATION, SPECIFICATION_PATH, approved PRD path/revision/SHA, and a PRD-language USER_REQUEST. The external helper alone owns its mode stages, passes, detailed coverage, and global not-applicable policy. After generic PASS it emits the request-named helper-owned result, report, and coverage artifacts; run record-helper-result. The Director validates only request/result/output SHAs, authority/language, operation/route, exact write set, external entrypoint/emitter fingerprints, artifact SHAs, and one-use consumption. It MUST NOT author the helper result or reconstruct/parse stage/pass topology. The persistent Architect performs pre-accept semantic assessment and returns an exact-SHA non-empty section-applicability/minimality inventory covering every top-level section plus standalone diagram, table, hierarchy description, and footer block. Reject and enumerate correction for unsupported scaffolding or complexity; retain substantively PRD-backed content. Before any correction write run prepare-helper --operation correction with every correction ID, invoke the same external skill through spec-assistant -> fragment-capture against the exact current/prewrite SHA, then record-helper-result. Any drift, replay, local draft/result, active unconsumed request, foreign identity, write-boundary violation, or missing artifact fails closed. accept-spec takes only --preaccept-receipt and requires the consumed helper chain to end at the current SHA. No Proofreader credit exists before acceptance. After record-proofread, a byte-changing correction uses the same prepare/invoke/record flow; complete-cycle validates old acceptance at the wave input and the consumed correction chain, closes to awaiting_accept, and requires fresh preaccept plus accept-spec before a fresh Proofreader. No-edit complete-cycle preserves acceptance and reviewing. Apply KISS/YAGNI, ignore theoretical or optional improvements without concrete evidence on a current supported PRD path, stop when mandatory coverage and minimal sufficient design are proven, return SPEC_READY plus NEXT_ACTION, and do not start planning."

policy:
  allow_implicit_invocation: false
