interface:
  display_name: "GameDev Production Pipeline"
  short_description: "Explicit-only bounded GameDev production pipeline"
  default_prompt: "Use $gamedev-pipeline as the sole v2 Director for exact requirements/specification/plan authority and structured slices; delegate fresh phase workers with current relevant technical-decisions journal context and continue through verified production-ready candidate. Resolve technical disagreements through sanctioned actions and ordinary remediation; user-owned changes require the user's local-amendment or upstream-revision decision. On any suspected pipeline/controller/runtime/skill defect, stop the product run, report bounded redacted evidence, and never patch or bypass the pipeline without a new explicit user maintenance command."
policy:
