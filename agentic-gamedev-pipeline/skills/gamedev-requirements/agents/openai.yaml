interface:
  display_name: "GameDev Requirements"
  short_description: "Explicit-only GameDev requirements workflow"
  default_prompt: "Use $gamedev-requirements to maintain a confirmation-only canonical PRD: write only exact user-confirmed semantics, keep every agent proposal outside the artifact as a question with 2-3 options and tradeoffs, never expand a short confirmation into unstated consequences, require explicit approval before PRD_READY, return NEXT_ACTION, and stop."
policy:
  allow_implicit_invocation: false
